<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BUS 104 Data Card</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; -moz-user-select: none; user-select: none; }
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
  .wrap { padding: 6px 8px; position: relative; }
  canvas { display: block; width: 100%; border-radius: 6px; }
  .alt-summary { position: absolute; left: -9999px; top: -9999px; width: 1px; height: 1px; overflow: hidden; opacity: 0; font-size: 0; line-height: 0; pointer-events: none; }
  @media print { body { display: none !important; } }
</style>
</head>
<body oncontextmenu="return false;" oncopy="return false;" oncut="return false;" ondragstart="return false;">
<div class="alt-summary" aria-hidden="true">when total power limit is tightened from 10 kW down to 9 kW</div>
<div class="wrap">
  <canvas id="qcanvas"></canvas>
</div>
<script>
(function() {
  const ENC = "GRUGVQUCABAMFCNmYhhTAlYXRGgUV1UABBZBel9MB1UHRURkEwoCQFdbDFpfX0JuFwVUBVVFJEdSXxVaX19CcAtZBUYYRTVHemZBcF5cBxBOFQhdDwAWEAxtQ3pfSxJXAUNEQAkARVFZWxFfVEwHElIaVRQjDAtTRE9Ben1oQkEBRQ1EFUUHV1pZFhNXVxASEVIIUQIRDFxRFgJfXk0GEhFSFkIEFxYSHmYORFRKQg5fF1UEQQ4yGwwUPB8TTANQDlJGDg8QCV4aFAJcVV1ACDkVDVkRChdGFkYUX0EYA0FCRwgWTUcIXVJTDRMMGBJeTHsUZBMKB15TW0kUYl0QRAdFFxNNRRVeGHoRflBAC18LTQEdQ0lHYRYLQWgWeUUeQhAmE01FQnERGkEUdR8/EE4VF0QFRVgSTREgFAsYVgdOF0N2Rl9FAQ4aQRRyH1gSUQVIFEYhQggWBFROExRAQhVFRAlBHkJzEQxBBR0YQhUgEF4UVElFEhF1RgkRDE4SQhAgE1tFVk8UGkNLEQVCSRENRFkOAQBeGFcFV25OA0ALVgZYBE0WHhZVAEcMHyBbDFYWTUZMRVRZREFAEVEMEjFKRhhDCApWU1pBGAwYEl5MWxRnFAhNaUVGBWhCZUIYQk8/RzxFA11EFhITWFZCYT8eRhhDCApWU1pBGAwYEl5MWxRnFAhNaUZBE2hCZUIYQk8/RzxFA11EFhITWFZCYT8eRAhcRVQCFBpDXl5cB15CHFkUGT5CcxFrQRgRQDkVIBA5FF1YRQMUGkNBVEtCD0JaC1AECUtBWVoXVhkRQB5ARxZdDxFNFXtXGRNiSAdXBhdZE01FFV4YQABfRF1KXw1TAVhPCgdYU1UVWkddSxtAahk=";
  const KEY = "b7d4aee266a318b2";
  function decodePayload(b64, key) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) {
      bytes[i] = bin.charCodeAt(i) ^ key.charCodeAt(i % key.length);
    }
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  document.addEventListener("keydown", function(e) {
    if ((e.ctrlKey || e.metaKey) && ["c", "x", "a", "u", "s", "p"].includes(e.key.toLowerCase())) {
      e.preventDefault();
    }
  });

  const data = decodePayload(ENC, KEY);
  const canvas = document.getElementById("qcanvas");
  const ctx = canvas.getContext("2d");

  function wrapParagraphs(paras, maxWidth, font) {
    ctx.font = font;
    const out = [];
    for (const para of (paras || [])) {
      if (!String(para).trim()) { out.push(""); continue; }
      const words = String(para).split(/\s+/);
      let line = "";
      for (const w of words) {
        const test = line ? line + " " + w : w;
        if (ctx.measureText(test).width > maxWidth && line) {
          out.push(line);
          line = w;
        } else {
          line = test;
        }
      }
      if (line) out.push(line);
    }
    return out;
  }

  function drawMap(mapSpec, padX, topY, maxW) {
    const panelH = 200;
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(padX, topY, maxW, panelH);
    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 1.2;
    ctx.strokeRect(padX, topY, maxW, panelH);

    // Map header caption
    ctx.font = "700 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    ctx.fillStyle = "#0a2240";
    ctx.fillText(mapSpec.title || "Campus Walkway Grid", padX + 10, topY + 17);

    // Legend top-right
    if (mapSpec.legend && mapSpec.legend.length) {
      ctx.font = "11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      let lx = padX + maxW - 12;
      for (let i = mapSpec.legend.length - 1; i >= 0; i--) {
        const leg = mapSpec.legend[i];
        const tw = ctx.measureText(leg.label).width;
        lx -= tw;
        ctx.fillStyle = "#334155";
        ctx.fillText(leg.label, lx, topY + 17);
        lx -= 14;
        ctx.fillStyle = leg.color;
        if (leg.shape === "square") {
          ctx.fillRect(lx, topY + 8, 9, 9);
        } else {
          ctx.beginPath();
          ctx.arc(lx + 4.5, topY + 12.5, 4.5, 0, Math.PI * 2);
          ctx.fill();
        }
        lx -= 16;
      }
    }

    const plotL = padX + 44;
    const plotR = padX + maxW - 24;
    const plotT = topY + 32;
    const plotB = topY + panelH - 26;
    const plotW = plotR - plotL;
    const plotH = plotB - plotT;
    const xMax = mapSpec.xMax || 8;
    const yMax = mapSpec.yMax || 4;
    const toPxX = x => plotL + (x / xMax) * plotW;
    const toPxY = y => plotB - (y / yMax) * plotH;

    // Grid lines
    ctx.save();
    ctx.strokeStyle = "#e2e8f0";
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    for (let gx = 0; gx <= xMax; gx++) {
      const px = toPxX(gx);
      ctx.beginPath(); ctx.moveTo(px, plotT); ctx.lineTo(px, plotB); ctx.stroke();
    }
    for (let gy = 0; gy <= yMax; gy++) {
      const py = toPxY(gy);
      ctx.beginPath(); ctx.moveTo(plotL, py); ctx.lineTo(plotR, py); ctx.stroke();
    }
    ctx.restore();

    // Axes frame & ticks
    ctx.strokeStyle = "#94a3b8";
    ctx.lineWidth = 1.2;
    ctx.strokeRect(plotL, plotT, plotW, plotH);
    ctx.font = "10.5px ui-monospace, SFMono-Regular, Menlo, monospace";
    ctx.fillStyle = "#475569";
    ctx.textAlign = "center";
    for (let gx = 0; gx <= xMax; gx++) {
      ctx.fillText(String(gx), toPxX(gx), plotB + 13);
    }
    ctx.fillStyle = "#64748b";
    ctx.fillText(mapSpec.xLabel || "East-West Street Block (x)", plotL + plotW / 2, plotB + 23);
    ctx.textAlign = "right";
    ctx.fillStyle = "#475569";
    for (let gy = 0; gy <= yMax; gy++) {
      ctx.fillText(String(gy), plotL - 7, plotB - (gy / yMax) * plotH + 3.5);
    }
    ctx.textAlign = "left";

    // Optional tour/reference dashed segments
    if (mapSpec.edges && mapSpec.edges.length) {
      const nodeById = {};
      (mapSpec.nodes || []).forEach(n => { nodeById[n.id] = n; });
      mapSpec.edges.forEach(e => {
        const u = nodeById[e.from], v = nodeById[e.to];
        if (!u || !v) return;
        ctx.save();
        ctx.strokeStyle = e.color || "#94a3b8";
        ctx.lineWidth = e.width || 1.6;
        if (e.dashed) ctx.setLineDash([5, 4]);
        ctx.beginPath();
        ctx.moveTo(toPxX(u.x), toPxY(u.y));
        ctx.lineTo(toPxX(v.x), toPxY(v.y));
        ctx.stroke();
        ctx.restore();
      });
    }

    // Plot nodes
    (mapSpec.nodes || []).forEach(n => {
      const px = toPxX(n.x);
      const py = toPxY(n.y);
      ctx.fillStyle = n.color || "#0a2240";
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.5;
      if (n.shape === "square") {
        ctx.fillRect(px - 5.5, py - 5.5, 11, 11);
        ctx.strokeRect(px - 5.5, py - 5.5, 11, 11);
      } else {
        ctx.beginPath();
        ctx.arc(px, py, 5.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
      ctx.font = "700 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillStyle = n.textColor || n.color || "#0f172a";
      ctx.textAlign = n.align || "center";
      ctx.fillText(n.label, px + (n.ox || 0), py + (n.oy || -10));
    });
    ctx.textAlign = "left";
    return panelH;
  }

  function draw() {
    const dpr = Math.max(window.devicePixelRatio || 1, 1);
    const cssWidth = Math.max(canvas.parentElement.clientWidth - 16, 360);
    const padX = 16, padY = 14;
    const maxW = cssWidth - padX * 2;
    const stemFont = "14.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    const badgeFont = "700 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    const tblFont = "12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    const tblHeadFont = "700 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    const codeFont = "12.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace";

    const lines = wrapParagraphs(data.lines, maxW, stemFont);
    const lineH = 22;
    const badgeH = 24;

    const mapH = data.map ? 214 : 0;

    let tblH = 0;
    const tbl = data.table;
    const rowH = 27;
    if (tbl && ((tbl.headers && tbl.headers.length) || (tbl.rows && tbl.rows.length))) {
      const nRows = (tbl.headers && tbl.headers.length ? 1 : 0) + (tbl.rows ? tbl.rows.length : 0);
      tblH = 12 + nRows * rowH + 6;
    }

    let codeH = 0;
    const codeLines = data.code || [];
    const codeLineH = 20;
    if (codeLines.length > 0) {
      codeH = 14 + codeLines.length * codeLineH + 14;
    }

    const cssHeight = padY * 2 + badgeH + lines.length * lineH + mapH + tblH + codeH + 8;
    canvas.width = Math.floor(cssWidth * dpr);
    canvas.height = Math.floor(cssHeight * dpr);
    canvas.style.width = cssWidth + "px";
    canvas.style.height = cssHeight + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#f8fafc";
    ctx.fillRect(0, 0, cssWidth, cssHeight);
    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(0.75, 0.75, cssWidth - 1.5, cssHeight - 1.5);

    ctx.fillStyle = "#0a2240";
    ctx.fillRect(0, 0, cssWidth, 28);
    ctx.font = badgeFont;
    ctx.fillStyle = "#ffb81c";
    ctx.fillText(data.badge, padX, 19);

    ctx.font = stemFont;
    ctx.fillStyle = "#0f172a";
    let y = 48;
    for (const ln of lines) {
      ctx.fillText(ln, padX, y);
      y += lineH;
    }

    if (data.map) {
      y += 2;
      y += drawMap(data.map, padX, y, maxW) + 10;
    }

    if (codeLines.length > 0) {
      y += 4;
      const boxH = codeLines.length * codeLineH + 16;
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(padX, y, maxW, boxH);
      ctx.font = codeFont;
      ctx.fillStyle = "#f8fafc";
      let cy = y + 20;
      for (const cln of codeLines) {
        ctx.fillText(cln, padX + 12, cy);
        cy += codeLineH;
      }
      y += boxH + 8;
    }

    if (tbl && tblH > 0) {
      y += 6;
      const cols = (tbl.headers && tbl.headers.length) || (tbl.rows && tbl.rows[0] ? tbl.rows[0].length : 1);
      const colWidths = tbl.colWeights
        ? tbl.colWeights.map(w => maxW * w)
        : Array(Math.max(cols, 1)).fill(maxW / Math.max(cols, 1));
      const hlSet = new Set((tbl.highlightCells || []).map(rc => rc[0] + ":" + rc[1]));
      const drawRowCells = (vals, rowY, isHead, rIdx) => {
        let cx = padX;
        vals.forEach((val, cIdx) => {
          const w = colWidths[cIdx] || (maxW / cols);
          if (isHead) {
            ctx.fillStyle = "#e2e8f0";
            ctx.fillRect(cx, rowY, w, rowH);
          } else if (hlSet.has(rIdx + ":" + cIdx)) {
            ctx.fillStyle = "#dcfce7";
            ctx.fillRect(cx, rowY, w, rowH);
          }
          ctx.strokeStyle = "#cbd5e1";
          ctx.lineWidth = 1;
          ctx.strokeRect(cx, rowY, w, rowH);
          ctx.font = isHead ? tblHeadFont : tblFont;
          ctx.fillStyle = (!isHead && hlSet.has(rIdx + ":" + cIdx)) ? "#166534" : "#0f172a";
          ctx.fillText(String(val), cx + 7, rowY + 18);
          cx += w;
        });
      };
      if (tbl.headers && tbl.headers.length) {
        drawRowCells(tbl.headers, y, true, -1);
        y += rowH;
      }
      if (tbl.rows) {
        tbl.rows.forEach((row, rIdx) => {
          ctx.fillStyle = rIdx % 2 === 0 ? "#ffffff" : "#f1f5f9";
          ctx.fillRect(padX, y, maxW, rowH);
          drawRowCells(row, y, false, rIdx);
          y += rowH;
        });
      }
    }
  }

  draw();
  window.addEventListener("resize", draw);
})();
</script>
</body>
</html>
